<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" aria-label="Rafolino Gostosuras">
        <span class="brand-name">Rafolino</span>
        <span class="brand-small">Gostosuras</span>
      </div>
      <h1 class="screen-title" id="screenTitle">Fornadas</h1>
    </div>
  </header>

  <main id="app" class="screen" aria-live="polite">
    <p class="empty">Abrindo o caderno…</p>

  <nav class="tabbar" aria-label="Seções">
    <button class="tab" data-tab="fornadas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7Z"/><path d="M3 11h18"/><path d="M8 7c0-1.5 1-2 1-3M12 7c0-1.5 1-2 1-3M16 7c0-1.5 1-2 1-3"/></svg>

    </button>
    <button class="tab" data-tab="receitas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l3 3v15H6z"/><path d="M9 9h7M9 13h7M9 17h4"/></svg>
      <span>Receitas</span>
    </button>
    <button class="tab" data-tab="ingredientes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10M8 4v3l-3 5v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6l-3-5V4"/><path d="M5 13h14"/></svg>
      <span>Ingredientes</span>

    <button class="tab" data-tab="compras">

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
